<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Restrito - Marmita Express</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: #F3F4F6; display: flex; justify-content: center; align-items: center; height: 100vh; color: #1F2937; }
        .login-box { background: #FFFFFF; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        .login-box h2 { color: #FF7043; margin-bottom: 8px; font-size: 1.6rem; }
        .login-box p { color: #6B7280; font-size: 0.9rem; margin-bottom: 25px; }
        .input-group { margin-bottom: 15px; text-align: left; }
        .input-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 0.9rem; }
        .input-group input { width: 100%; padding: 12px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 1rem; }
        .input-group input:focus { outline: none; border-color: #FF8C69; box-shadow: 0 0 0 3px rgba(255, 140, 105, 0.2); }
        .btn-login { width: 100%; background: #FF7043; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; }
        .btn-login:hover { background: #E65100; }
        .erro { color: #DC2626; background: #FEE2E2; padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.9rem; font-weight: bold; display: none; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>🔒 Área Administrativa</h2>
        <p>Marmita Express — Painel de Gestão</p>

        <div class="erro" id="msg-erro">❌ E-mail ou senha incorretos.</div>

        <div class="input-group">
            <label>E-mail</label>
            <input type="email" id="email" value="admin@admin.com" required>
        </div>
        <div class="input-group">
            <label>Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha" required>
        </div>
        <button class="btn-login" onclick="fazerLogin()">Entrar</button>
    </div>

    <script>
        // Se já está logado, vai direto pro painel
        if (sessionStorage.getItem('admin_logado')) {
            window.location.href = 'admin.html';
        }

        // Credenciais do admin
        // Para alterar: mude os valores abaixo e faça um novo deploy
        const ADMIN_EMAIL = 'admin@admin.com';
        const ADMIN_SENHA = 'admin123';

        function fazerLogin() {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value.trim();
            const msgErro = document.getElementById('msg-erro');

            if (email === ADMIN_EMAIL && senha === ADMIN_SENHA) {
                sessionStorage.setItem('admin_logado', 'true');
                window.location.href = 'admin.html';
            } else {
                msgErro.style.display = 'block';
                document.getElementById('senha').value = '';
                document.getElementById('senha').focus();
            }
        }

        // Permite logar com Enter
        document.getElementById('senha').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') fazerLogin();
        });
        document.getElementById('email').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') fazerLogin();
        });
    </script>
</body>
</html>
