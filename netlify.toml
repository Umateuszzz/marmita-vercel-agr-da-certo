[build]
  publish = "."
  functions = "netlify/functions"

# Redireciona montar.html para index.html (era a versão PHP do mesmo cardápio)
[[redirects]]
  from = "/montar.html"
  to = "/index.html"
  status = 301

# Remove arquivos PHP legados da rota pública (retorna 404 limpo)
[[redirects]]
  from = "/config.html"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/salvar_pedido.html"
  to = "/404.html"
  status = 404

# Headers de segurança
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache de assets estáticos
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
