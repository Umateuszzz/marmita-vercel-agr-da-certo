
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marmita Express</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f5f5f5}
.container{max-width:1200px;margin:auto;padding:20px}
.page{display:grid;grid-template-columns:2fr 1fr;gap:25px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:20px}
.options-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item-btn{padding:15px;border:2px solid #ddd;background:white;border-radius:12px;cursor:pointer}
.item-btn.selected{border-color:#ff7043;background:#fff1eb}
.cart{position:sticky;top:10px}
input,select,textarea,button{
width:100%;padding:12px;margin-bottom:10px;
border-radius:8px;border:1px solid #ccc;box-sizing:border-box;
}
button{background:#25d366;color:white;border:none;font-weight:bold;cursor:pointer}
@media(max-width:900px){.page{grid-template-columns:1fr}.cart{position:relative}}
</style>
</head>

<body>

<div class="container">

<h1>Marmita Express</h1>

<div class="page">

<div>

<div class="card">
<h3>Tamanho</h3>
<div id="grid-tamanho" class="options-grid"></div>
</div>

<div class="card">
<h3>Feijão</h3>
<div id="grid-feijao" class="options-grid"></div>
</div>

<div class="card">
<h3>Massa</h3>
<div id="grid-massa" class="options-grid"></div>
</div>

<div class="card">
<h3>Legumes</h3>
<div id="grid-legumes" class="options-grid"></div>
</div>

<div class="card">
<h3>Outros (máx 2)</h3>
<div id="grid-outros" class="options-grid"></div>
</div>

<div class="card">
<h3>Salada (máx 2)</h3>
<div id="grid-salada" class="options-grid"></div>
</div>

<div class="card">
<h3>Proteína</h3>
<div id="grid-proteina" class="options-grid"></div>
</div>

</div>

<div class="cart">

<div class="card">

<h2>Pedido</h2>

<div id="cart-items">Nenhum item.</div>

<p>Subtotal: <span id="subtotal">R$0,00</span></p>
<p>Entrega: <span id="delivery-fee">R$3,00</span></p>
<h3>Total: <span id="total">R$0,00</span></h3>

<input id="c-nome" placeholder="Nome">
<input id="c-telefone" placeholder="Telefone">

<select id="c-tipo">
<option value="delivery">Delivery</option>
<option value="retirada">Retirada</option>
</select>

<select id="c-regiao">
<option value="dentro">Cidade</option>
<option value="fora">Cana Verde</option>
</select>

<input id="c-endereco" placeholder="Endereço">

<select id="c-pagamento">
<option value="">Pagamento</option>
<option value="PIX">PIX</option>
<option value="Cartão">Cartão</option>
<option value="Dinheiro">Dinheiro</option>
</select>

<textarea id="c-obs" placeholder="Observações"></textarea>

<button id="btn-finish">Finalizar Pedido</button>

</div>

</div>

</div>

</div>

<script>

const SUPABASE_URL="SUA_URL_SUPABASE"
const SUPABASE_ANON_KEY="SUA_ANON_KEY"

const sbClient=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
)

const icones={

tamanho:"🍱",

feijao:"🫘",

massa:"🍝",

legumes:"🥦",

outros:"🍟",

salada:"🥗",

proteina:"🍖"

}

const LIMITES={

tamanho:1,

feijao:1,

massa:1,

legumes:1,

outros:2,

salada:2,

proteina:1

}

const cart={

tamanho:null,

feijao:[],

massa:[],

legumes:[],

outros:[],

salada:[],

proteina:[],

subtotal:0,

taxaEntrega:3

}

window.addEventListener(

"DOMContentLoaded",

carregarProdutos

)

async function carregarProdutos(){

const {data,error}=

await sbClient

.from("produtos")

.select("*")

.order("id")

if(error){

alert(
"Erro carregando cardápio"
)

console.log(error)

return

}

data.forEach(item=>{

const grid=

document.getElementById(

`grid-${item.categoria}`

)

if(!grid)return

const btn=

document.createElement(

"button"

)

btn.className=

"item-btn"

btn.dataset.type=

item.categoria

btn.dataset.name=

item.nome

btn.dataset.price=

item.preco

btn.innerHTML=`

<div class="emoji">

${icones[item.categoria]}

</div>

<div class="nome">

${item.nome}

</div>

<div class="preco">

${item.preco>0

?

"+ R$ "+Number(

item.preco

).toFixed(2)

.replace(".",",")

:

""

}

</div>

`

btn.onclick=()=>{

selecionarItem(btn)

}

grid.appendChild(btn)

})

}

function selecionarItem(btn){

const type=

btn.dataset.type

const name=

btn.dataset.name

const price=

Number(

btn.dataset.price

)

if(type==="tamanho"){

document

.querySelectorAll(

'.item-btn[data-type="tamanho"]'

)

.forEach(b=>

b.classList.remove(

"selected"

)

)

cart.tamanho={

name,

price

}

btn.classList.add(

"selected"

)

updateCart()

return

}

const existe=

cart[type]

.findIndex(

i=>i.name===name

)

if(

existe>-1

){

cart[type]

.splice(

existe,

1

)

btn.classList.remove(

"selected"

)

}else{

if(

LIMITES[type]===1

){

document

.querySelectorAll(

`.item-btn[data-type="${type}"]`

)

.forEach(

b=>b.classList.remove(

"selected"

)

)

cart[type]=[]

}

if(

cart[type].length>=LIMITES[type]

){

alert(

`Máximo ${LIMITES[type]}`

)

return

}

cart[type].push({

name,

price

})

btn.classList.add(

"selected"

)

}

updateCart()

}

function updateCart(){

const div=

document.getElementById(

"cart-items"

)

div.innerHTML=""

cart.subtotal=0

if(

cart.tamanho

){

div.innerHTML+=`

<p>

🍱

${cart.tamanho.name}

</p>

`

cart.subtotal+=

cart.tamanho.price

}

const categorias=[

"feijao",

"massa",

"legumes",

"outros",

"salada",

"proteina"

]

categorias.forEach(cat=>{

cart[cat]

.forEach(item=>{

div.innerHTML+=`

<p>

${icones[cat]}

${item.name}

</p>

`

cart.subtotal+=

item.price

})

})

if(

div.innerHTML===""

){

div.innerHTML=

"<p>Nenhum item</p>"

}

const taxa=

document

.getElementById(

"c-tipo"

).value

==="delivery"

?

cart.taxaEntrega

:0

document

.getElementById(

"subtotal"

).innerText=

`R$ ${cart.subtotal

.toFixed(2)

.replace(".",",")}`

document

.getElementById(

"delivery-fee"

).innerText=

`R$ ${taxa

.toFixed(2)

.replace(".",",")}`

document

.getElementById(

"total"

).innerText=

`R$ ${(cart.subtotal+taxa)

.toFixed(2)

.replace(".",",")}`

}

document

.getElementById(

"c-regiao"

)

.addEventListener(

"change",

function(){

cart.taxaEntrega=

this.value==="fora"

?6

:3

updateCart()

}

)

document

.getElementById(

"c-tipo"

)

.addEventListener(

"change",

updateCart

)

document

.getElementById(

"btn-finish"

)

.addEventListener(

"click",

finalizarPedido

)

async function finalizarPedido(){

if(

!cart.tamanho

){

alert(

"Escolha tamanho"

)

return

}

const nome=

document.getElementById(

"c-nome"

).value

const telefone=

document.getElementById(

"c-telefone"

).value

const pagamento=

document.getElementById(

"c-pagamento"

).value

if(

!nome||

!telefone

){

alert(

"Preencha nome e telefone"

)

return

}

if(

!pagamento

){

alert(

"Selecione pagamento"

)

return

}

const itens=[]

if(

cart.tamanho

){

itens.push(

cart.tamanho.name

)

}

Object.keys(cart)

.forEach(key=>{

if(

Array.isArray(

cart[key]

)

){

cart[key]

.forEach(i=>

itens.push(

i.name

)

)

}

})

const codigo=

"ORD-"+Date.now()

const total=

cart.subtotal+

(

document

.getElementById(

"c-tipo"

).value

==="delivery"

?

cart.taxaEntrega

:0

)

const {error}=

await sbClient

.from(

"pedidos"

)

.insert([{

codigo,

cliente_name:nome,

cliente_telefone:

telefone,

itens,

total,

status:

"pendente"

}])

if(error){

alert(

error.message

)

return

}

alert(

"Pedido enviado!"

)

window.location.href=

"index.html"

}

</script>

</body>
</html>
