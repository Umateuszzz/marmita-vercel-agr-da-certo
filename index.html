
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marmita Express</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{margin:0;font-family:Segoe UI;background:#f5f5f5}
.container{max-width:1200px;margin:auto;padding:20px}
.page{display:grid;grid-template-columns:2fr 1fr;gap:25px}
.card{background:white;padding:20px;border-radius:14px;margin-bottom:20px}
.options-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.item-btn{padding:15px;border:2px solid #ddd;background:white;border-radius:12px;cursor:pointer}
.item-btn.selected{border-color:#ff7043;background:#fff1eb}
.cart{position:sticky;top:10px}
input,select,textarea,button{
width:100%;padding:12px;margin-bottom:10px;
border-radius:8px;border:1px solid #ccc;box-sizing:border-box;
}
button{background:#25d366;color:white;border:none;font-weight:bold;cursor:pointer}
@media(max-width:900px){.page{grid-template-columns:1fr}.cart{position:relative}}
</style>
</head>

<body>

<div class="container">

<h1>Marmita Express</h1>

<div class="page">

<div>

<div class="card">
<h3>Tamanho</h3>
<div id="grid-tamanho" class="options-grid"></div>
</div>

<div class="card">
<h3>Feijão</h3>
<div id="grid-feijao" class="options-grid"></div>
</div>

<div class="card">
<h3>Massa</h3>
<div id="grid-massa" class="options-grid"></div>
</div>

<div class="card">
<h3>Legumes</h3>
<div id="grid-legumes" class="options-grid"></div>
</div>

<div class="card">
<h3>Outros (máx 2)</h3>
<div id="grid-outros" class="options-grid"></div>
</div>

<div class="card">
<h3>Salada (máx 2)</h3>
<div id="grid-salada" class="options-grid"></div>
</div>

<div class="card">
<h3>Proteína</h3>
<div id="grid-proteina" class="options-grid"></div>
</div>

</div>

<div class="cart">

<div class="card">

<h2>Pedido</h2>

<div id="cart-items">Nenhum item.</div>

<p>Subtotal: <span id="subtotal">R$0,00</span></p>
<p>Entrega: <span id="delivery-fee">R$3,00</span></p>
<h3>Total: <span id="total">R$0,00</span></h3>

<input id="c-nome" placeholder="Nome">
<input id="c-telefone" placeholder="Telefone">

<select id="c-tipo">
<option value="delivery">Delivery</option>
<option value="retirada">Retirada</option>
</select>

<select id="c-regiao">
<option value="dentro">Cidade</option>
<option value="fora">Cana Verde</option>
</select>

<input id="c-endereco" placeholder="Endereço">

<select id="c-pagamento">
<option value="">Pagamento</option>
<option value="PIX">PIX</option>
<option value="Cartão">Cartão</option>
<option value="Dinheiro">Dinheiro</option>
</select>

<textarea id="c-obs" placeholder="Observações"></textarea>

<button id="btn-finish">Finalizar Pedido</button>

</div>

</div>

</div>

</div>

<script>

const SUPABASE_URL="https://saruqsgujswkqznizqvw.supabase.co"
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNhcnVxc2d1anN3a3F6bml6cXZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwMDE4MTMsImV4cCI6MjA5NTU3NzgxM30.ty1MlDwCWzTz28NAivTOJXknxWJRfzd0zpwp5RULLo8"

const sb=supabase.createClient(
SUPABASE_URL,
SUPABASE_ANON_KEY
)

const LIMITES={
tamanho:1,
feijao:1,
massa:1,
legumes:1,
outros:2,
salada:2,
proteina:1
}

const cart={
subtotal:0,
taxa:3,
tamanho:[],
feijao:[],
massa:[],
legumes:[],
outros:[],
salada:[],
proteina:[]
}

window.addEventListener(
"DOMContentLoaded",
carregar
)

async function carregar(){

const {data,error}=await sb
.from("produtos")
.select("*")
.order("id")

if(error){
alert(error.message)
return
}

data.forEach(item=>{

const grid=document.getElementById(
"grid-"+item.categoria
)

if(!grid)return

const btn=document.createElement(
"button"
)

btn.className="item-btn"

btn.innerHTML=
item.nome+

(item.preco>0?
"<br>+R$ "+Number(item.preco).toFixed(2)
:"")

btn.dataset.type=item.categoria
btn.dataset.name=item.nome
btn.dataset.price=item.preco

btn.onclick=()=>selecionar(btn)

grid.appendChild(btn)

})

}

function selecionar(btn){

const type=btn.dataset.type
const name=btn.dataset.name
const price=Number(btn.dataset.price)

const lista=cart[type]

const idx=lista.findIndex(
x=>x.name===name
)

if(idx>-1){

lista.splice(idx,1)
btn.classList.remove("selected")

}else{

if(lista.length>=LIMITES[type]){

document.querySelectorAll(
`.item-btn[data-type="${type}"]`
).forEach(x=>{

if(LIMITES[type]===1){

x.classList.remove("selected")

}

})

if(LIMITES[type]===1){

cart[type]=[]

}

if(cart[type].length>=LIMITES[type]){
alert("Limite atingido")
return
}

}

cart[type].push({
name,price
})

btn.classList.add("selected")

}

atualizar()

}

function atualizar(){

const div=document.getElementById(
"cart-items"
)

cart.subtotal=0

let html=""

Object.keys(cart).forEach(k=>{

if(!Array.isArray(cart[k]))return

cart[k].forEach(i=>{

cart.subtotal+=i.price

html+=i.name+"<br>"

})

})

div.innerHTML=html||"Nenhum item."

const taxa=
document.getElementById(
"c-tipo"
).value==="delivery"

?cart.taxa:0

document.getElementById(
"subtotal"
).innerText=
"R$ "+cart.subtotal.toFixed(2)

document.getElementById(
"delivery-fee"
).innerText=
"R$ "+taxa.toFixed(2)

document.getElementById(
"total"
).innerText=
"R$ "+(cart.subtotal+taxa).toFixed(2)

}

document.getElementById(
"c-regiao"
).onchange=function(){

cart.taxa=
this.value==="fora"
?6:3

atualizar()

}

document.getElementById(
"btn-finish"
).onclick=finalizar

async function finalizar(){

const nome=
document.getElementById("c-nome").value

const tel=
document.getElementById("c-telefone").value

if(!nome||!tel){

alert("Preencha nome e telefone")

return

}

const itens=[]

Object.keys(cart).forEach(k=>{

if(Array.isArray(cart[k])){

cart[k].forEach(i=>
itens.push(i.name)
)

}

})

const total=
cart.subtotal+

(
document.getElementById("c-tipo").value==="delivery"
?cart.taxa
:0
)

const codigo=
"ORD-"+Date.now()

const {error}=await sb
.from("pedidos")
.insert([{

codigo,

cliente_name:nome,

cliente_telefone:tel,

itens,

total,

status:"pendente"

}])

if(error){

alert(error.message)

return

}

alert("Pedido enviado!")

location.reload()

}

</script>

</body>
</html>
